<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Page -->
    <section id="loginPage" class="login-page">
        <div class="login-card">
            <h1>Secure Portal</h1>
            <p>Sign in to manage your documents</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>

                <button type="submit">Sign In</button>
                <p id="loginMessage"></p>
            </form>
        </div>
    </section>

    <!-- Main Dashboard -->
    <section id="dashboardPage" hidden>
        <aside class="sidebar">
            <h2>Secure Portal</h2>
            <button class="nav-button" data-page="dashboard">
                Dashboard
            </button>
            <button class="nav-button" data-page="documents">
                Documents
            </button>
            <button class="nav-button" data-page="search">
                Document Search
            </button>
            <button id="logoutBtn">Log Out</button>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Welcome, <span id="userEmail"></span></p>
            </header>

            <section id="dashboardSection" class="content-section">
                <h2>Your Workspace</h2>
                <div class="stat-card">
                    <p>Total Documents</p>
                    <h3 id="documentCount">0</h3>
                </div>
            </section>

            <section id="documentsSection"
                     class="content-section" hidden>
                <h2>Manage Documents</h2>
                <label for="fileInput">Choose a document</label>
                <input type="file" id="fileInput"
                       accept=".pdf,.docx,.txt">
                <button id="uploadBtn">Upload Document</button>
                <p id="uploadMessage"></p>
                <div id="documentList"></div>
            </section>

            <section id="searchSection"
                     class="content-section" hidden>
                <h2>Search Your Documents</h2>
                <form id="searchForm">
                    <input type="search" id="searchInput"
                           placeholder="Enter a document keyword"
                           required>
                    <button type="submit">Search</button>
                </form>
                <div id="searchResults"></div>
            </section>
        </main>
    </section>
<!-- Website AI Assistant -->
<div id="aiAssistant">
    <button id="aiToggle">AI Assistant</button>

    <div id="aiChat" hidden>
        <div class="ai-header">
            <strong>Website Assistant</strong>
            <button id="aiClose" type="button">X</button>
        </div>

        <div id="aiMessages">
            <p>Hi! How can I help you use this website?</p>
        </div>

        <form id="aiForm">
            <input id="aiInput" type="text"
                   placeholder="Ask a question..." required>
            <button type="submit">Send</button>
        </form>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
